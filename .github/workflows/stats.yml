name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate stats card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=milerius&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true&show=reviews,prs_merged
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=milerius&show_icons=true&hide_border=true&count_private=true&include_all_commits=true&show=reviews,prs_merged
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top langs card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=milerius&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&hide=jupyter%20notebook&card_width=320
          path: profile/langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top langs card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=milerius&layout=compact&hide_border=true&langs_count=8&hide=jupyter%20notebook&card_width=320
          path: profile/langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Mantis (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=Milerius&repo=Mantis&theme=tokyonight&hide_border=true
          path: profile/pin-mantis-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Mantis (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=Milerius&repo=Mantis&hide_border=true
          path: profile/pin-mantis-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - mm2-client (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=Milerius&repo=mm2-client&theme=tokyonight&hide_border=true
          path: profile/pin-mm2-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - mm2-client (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=Milerius&repo=mm2-client&hide_border=true
          path: profile/pin-mm2-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
